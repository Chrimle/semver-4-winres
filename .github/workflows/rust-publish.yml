name: Rust Publish

on:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest

    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
